name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - run: python -m pip install --target .vendor -r requirements.txt
      - name: Prepare test directory
        run: New-Item -ItemType Directory -Force .runtime
      - run: npm run check
      - run: python scripts/validate-agent-kit.py
      - run: python -m unittest discover -s tests -q
      - run: node tests/completion.cjs
      - run: node tests/completion-store.cjs
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-frontend.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run-onboarding.ps1
      - run: npm run dist:win
      - run: python -m unittest tests.test_release_manifest -v
      - uses: actions/upload-artifact@v4
        with:
          name: Supporter-Windows-x64
          path: |
            release/*Setup-x64.exe
            release/*-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
